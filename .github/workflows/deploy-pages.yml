  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure build environment
        id: config
        run: |
          if [ "${{ github.repository }}" == "bernardkerr/spoke-web" ]; then
            echo "Configuring for Fork (bernardkerr/spoke-web)"
            echo "NEXT_PUBLIC_BASE_PATH=/spoke-web" >> $GITHUB_ENV
            echo "create_cname=false" >> $GITHUB_OUTPUT
          else
            echo "Configuring for Production (spoke-robotics.com)"
            echo "NEXT_PUBLIC_BASE_PATH=" >> $GITHUB_ENV
            echo "create_cname=true" >> $GITHUB_OUTPUT
          fi

      - name: Build static site (Next.js export)
        env:
          NODE_ENV: production
        run: |
          npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Add CNAME for custom domain
        if: steps.config.outputs.create_cname == 'true'
        run: echo spoke-robotics.com > out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
